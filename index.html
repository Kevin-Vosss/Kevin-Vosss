<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>profile</title>
<link href="https://fonts.cdnfonts.com/css/signerica-fat" rel="stylesheet">
<style>
  :root {
    --card-bg: #4a3d55;
    --card-border: #2a2233;
    --pill-bg: #f7f4f9;
    --pill-text: #2a2233;
    --icon-color: #2a2233;
    --panel-bg: #8d7a9c;
    --panel-bg-deep: #7a6889;
    --nav-btn-bg: #f7f4f9;
    --text-light: #ede7f2;
    --text-muted: #c3b6cf;
    --accent: #d8c9e3;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 16px;
    background: radial-gradient(circle at 30% 15%, #5c4a6b 0%, #3a2c46 45%, #1c1520 100%);
    font-family: 'Inter', 'Segoe UI', -apple-system, sans-serif;
  }

  .card {
    width: 404px;
    max-width: 100%;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.08);
    overflow: hidden;
    background: var(--panel-bg);
    box-shadow: 0 30px 70px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.06) inset;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: var(--card-bg);
    border-bottom: 1px solid rgba(0,0,0,0.25);
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
    border-radius: 8px;
    transition: transform 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .icon-btn:hover {
    transform: translateY(-1px);
    color: var(--text-light);
    background: rgba(255,255,255,0.06);
  }
  .icon-btn svg { width: 18px; height: 18px; }

  .status-pill {
    background: var(--pill-bg);
    color: var(--pill-text);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.3px;
    padding: 6px 16px;
    border-radius: 999px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.7);
    flex-shrink: 0;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .hero {
    width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: #b9c4e6;
    position: relative;
  }
  .hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transform: scale(1.02);
  }

  .hero-credit {
    position: absolute;
    right: 8px;
    bottom: 6px;
    font-family: 'Signerica Medium', 'Signerica Fat', cursive;
    font-size: 10px;
    letter-spacing: 0.3px;
    color: rgba(255,255,255,0.55);
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
  }

  .panel {
    background: linear-gradient(180deg, var(--panel-bg) 0%, var(--panel-bg-deep) 100%);
    padding: 22px 20px 26px;
  }

  .section-label {
    color: var(--text-light);
    font-family: 'Signerica Fat', cursive;
    font-size: 15px;
    letter-spacing: 0.2px;
    font-weight: 600;
    text-transform: lowercase;
    margin: 0 0 12px;
  }

  .nav-row {
    display: flex;
    gap: 10px;
    margin-bottom: 26px;
  }

  .nav-link {
    font-family: 'Signerica Fat', cursive;
    font-size: 15px;
    width: 44px;
    height: 44px;
    background: var(--nav-btn-bg);
    border: none;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: #2a2233;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .nav-link:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 18px rgba(0,0,0,0.3);
  }
  .nav-link svg { width: 22px; height: 22px; }

  .games-title {
    color: var(--text-light);
    font-family: 'Signerica Fat', cursive;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.2px;
    margin: 0 0 12px;
  }

  .games-frame {
    background: #241d2b;
    border-radius: 12px;
    padding: 8px;
  }

  .game-hero {
    width: 100%;
    aspect-ratio: 232 / 153;
    overflow: hidden;
    border-radius: 8px;
    margin-bottom: 8px;
  }
  .game-hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transform: scale(1.07) translateY(-1px);
  }

  .games-bottom-row {
    display: flex;
    gap: 8px;
  }
  .games-bottom-row .game-thumb {
    flex: 1;
    aspect-ratio: 114 / 76;
    overflow: hidden;
    border-radius: 6px;
  }
  .games-bottom-row .game-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.03); }

  .icon-btn.is-bookmarked {
    color: #f7f4f9;
    background: rgba(255,255,255,0.12);
  }

  .icon-btn:active {
    transform: scale(0.94);
  }

  @media (hover: none) {
    .icon-btn:hover {
      transform: none;
    }
  }

  @media (hover: hover) and (pointer: fine) {
    html, body, a, button, .icon-btn, .nav-link {
      cursor: none;
    }

    .cursor-dot,
    .cursor-ring {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 9999;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      will-change: transform;
    }

    .cursor-dot {
      width: 6px;
      height: 6px;
      background: #f3e8ff;
      box-shadow: 0 0 6px 2px rgba(168, 85, 247, 0.85);
      transition: opacity 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .cursor-ring {
      width: 44px;
      height: 44px;
      border: none;
      background: radial-gradient(
        circle,
        rgba(230, 200, 255, 0.9) 0%,
        rgba(168, 85, 247, 0.6) 30%,
        rgba(109, 40, 217, 0.32) 55%,
        rgba(76, 29, 149, 0.12) 75%,
        rgba(76, 29, 149, 0) 100%
      );
      mix-blend-mode: screen;
      filter: blur(1px);
      transition: width 0.25s ease, height 0.25s ease, opacity 0.2s ease,
        filter 0.25s ease, background 0.25s ease;
    }

    .cursor-ring.is-hover {
      width: 76px;
      height: 76px;
      filter: blur(2px);
      background: radial-gradient(
        circle,
        rgba(220, 255, 220, 0.95) 0%,
        rgba(74, 222, 128, 0.65) 28%,
        rgba(22, 163, 74, 0.35) 52%,
        rgba(6, 78, 59, 0.14) 74%,
        rgba(6, 78, 59, 0) 100%
      );
    }

    .cursor-dot.is-hover {
      background: #ecfdf5;
      box-shadow: 0 0 6px 2px rgba(34, 197, 94, 0.85);
    }

    .cursor-ring.is-hidden,
    .cursor-dot.is-hidden {
      opacity: 0;
    }
  }

  .tap-ripple {
    position: fixed;
    top: 0;
    left: 0;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%) scale(0.3);
    background: radial-gradient(
      circle,
      rgba(230, 200, 255, 0.9) 0%,
      rgba(168, 85, 247, 0.6) 30%,
      rgba(109, 40, 217, 0.32) 55%,
      rgba(76, 29, 149, 0.12) 75%,
      rgba(76, 29, 149, 0) 100%
    );
    mix-blend-mode: screen;
    filter: blur(1px);
    opacity: 0.9;
    animation: tap-ripple-burst 0.55s ease-out forwards;
  }

  .tap-ripple.is-hover {
    background: radial-gradient(
      circle,
      rgba(220, 255, 220, 0.95) 0%,
      rgba(74, 222, 128, 0.65) 28%,
      rgba(22, 163, 74, 0.35) 52%,
      rgba(6, 78, 59, 0.14) 74%,
      rgba(6, 78, 59, 0) 100%
    );
  }

  @keyframes tap-ripple-burst {
    0% {
      transform: translate(-50%, -50%) scale(0.3);
      opacity: 0.9;
    }
    100% {
      transform: translate(-50%, -50%) scale(1.6);
      opacity: 0;
    }
  }
</style>
</head>

  <script>
    (() => {
      const isFinePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
      if (!isFinePointer) return;

      const dot = document.getElementById('cursorDot');
      const ring = document.getElementById('cursorRing');
      if (!dot || !ring) return;

      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;
      let ringX = mouseX;
      let ringY = mouseY;
      let hasMoved = false;

      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        dot.style.transform = `translate(-50%, -50%) translate(${mouseX}px, ${mouseY}px)`;
        if (!hasMoved) {
          hasMoved = true;
          ringX = mouseX;
          ringY = mouseY;
          dot.classList.remove('is-hidden');
          ring.classList.remove('is-hidden');
        }
      });

      document.addEventListener('mouseleave', () => {
        dot.classList.add('is-hidden');
        ring.classList.add('is-hidden');
      });
      document.addEventListener('mouseenter', () => {
        dot.classList.remove('is-hidden');
        ring.classList.remove('is-hidden');
      });

      function tick() {
        ringX += (mouseX - ringX) * 0.18;
        ringY += (mouseY - ringY) * 0.18;
        ring.style.transform = `translate(-50%, -50%) translate(${ringX}px, ${ringY}px)`;
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);

      const hoverTargets = document.querySelectorAll(
        'a, button, .icon-btn, .nav-link, .status-pill, .avatar'
      );
      hoverTargets.forEach((el) => {
        el.addEventListener('mouseenter', () => {
          ring.classList.add('is-hover');
          dot.classList.add('is-hover');
        });
        el.addEventListener('mouseleave', () => {
          ring.classList.remove('is-hover');
          dot.classList.remove('is-hover');
        });
      });
    })();

    (() => {
      const isCoarsePointer = window.matchMedia('(pointer: coarse)').matches;
      if (!isCoarsePointer) return;

      const hoverSelector = 'a, button, .icon-btn, .nav-link, .status-pill, .avatar';

      document.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        if (!touch) return;

        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        const isInteractive = target && target.closest(hoverSelector);

        const ripple = document.createElement('div');
        ripple.className = 'tap-ripple' + (isInteractive ? ' is-hover' : '');
        ripple.style.left = `${touch.clientX}px`;
        ripple.style.top = `${touch.clientY}px`;
        document.body.appendChild(ripple);

        ripple.addEventListener('animationend', () => ripple.remove());
        setTimeout(() => ripple.remove(), 700);
      }, { passive: true });
    })();

    (() => {
      const likeBtn = document.getElementById('likeBtn');
      const reloadBtn = document.getElementById('reloadBtn');

      reloadBtn.addEventListener('click', () => {
        window.location.reload();
      });

      const bookmarkKey = 'profile-page-bookmarked';

      const setBookmarkState = (bookmarked) => {
        likeBtn.classList.toggle('is-bookmarked', bookmarked);
        likeBtn.setAttribute('aria-pressed', String(bookmarked));
        likeBtn.setAttribute(
          'aria-label',
          bookmarked ? 'Page bookmarked' : 'Bookmark this page'
        );
        likeBtn.setAttribute(
          'title',
          bookmarked ? 'Page bookmarked' : 'Bookmark this page'
        );
      };

      const isBookmarked = localStorage.getItem(bookmarkKey) === 'true';
      setBookmarkState(isBookmarked);

      likeBtn.addEventListener('click', async () => {
        const nextState = localStorage.getItem(bookmarkKey) !== 'true';
        localStorage.setItem(bookmarkKey, String(nextState));
        setBookmarkState(nextState);

        if (nextState) {
          const isMac = /Mac|iPhone|iPad|iPod/i.test(navigator.platform);
          const shortcut = isMac ? '⌘ + D' : 'Ctrl + D';

          if (window.matchMedia('(pointer: coarse)').matches) {
            alert('Page marked as bookmarked. To add it to your browser bookmarks, use your browser’s menu and choose Add to Bookmarks/Favorites.');
          } else {
            alert(`Page marked as bookmarked. To add it to the browser bookmarks, press ${shortcut}.`);
          }
        }
      });
    })();
  </script>
